<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaloriColor 💕</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffb6d9, #b8e7ff, #d8b4fe);
        min-height: 100vh;
        padding: 25px;
    }

    .app {
        max-width: 500px;
        margin: auto;
        background: white;
        border-radius: 30px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
        text-align: center;
        color: #ff4f9a;
        margin-bottom: 5px;
    }

    .subtitulo {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    .emoji {
        text-align: center;
        font-size: 55px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        color: #555;
    }

    input, select {
        width: 100%;
        padding: 13px;
        margin-top: 7px;
        border: 2px solid #ffd0e6;
        border-radius: 12px;
        font-size: 16px;
        outline: none;
    }

    input:focus, select:focus {
        border-color: #ff66a8;
    }

    .botones {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    button {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 15px;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .calcular {
        background: #ff5fa2;
    }

    .limpiar {
        background: #8e7dff;
    }

    button:hover {
        transform: scale(1.03);
    }

    #resultado {
        display: none;
        margin-top: 25px;
        padding: 20px;
        border-radius: 20px;
        background: linear-gradient(135deg, #fff0f7, #e9f7ff);
        text-align: center;
    }

    #calorias {
        font-size: 38px;
        color: #ff4f9a;
        font-weight: bold;
    }

    .barra {
        height: 18px;
        background: #eee;
        border-radius: 20px;
        overflow: hidden;
        margin-top: 15px;
    }

    #progreso {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ff65a8, #8e7dff);
        transition: 1s;
    }

    .mensaje {
        margin-top: 15px;
        color: #555;
    }

    .nota {
        font-size: 12px;
        color: #777;
        margin-top: 20px;
        text-align: center;
    }
</style>
</head>

<body>

<div class="app">

    <div class="emoji">🍓✨</div>

    <h1>CaloriColor</h1>

    <p class="subtitulo">
        Descubre una estimación de tus calorías diarias 💕
    </p>

    <label>Edad</label>
    <input type="number" id="edad" placeholder="Ej: 16">

    <label>Sexo</label>
    <select id="sexo">
        <option value="">Selecciona</option>
        <option value="mujer">Mujer</option>
        <option value="hombre">Hombre</option>
    </select>

    <label>Peso (kg)</label>
    <input type="number" id="peso" placeholder="Ej: 55">

    <label>Altura (cm)</label>
    <input type="number" id="altura" placeholder="Ej: 165">

    <label>Nivel de actividad</label>
    <select id="actividad">
        <option value="">Selecciona</option>
        <option value="1.2">Poco activo 🛋️</option>
        <option value="1.375">Actividad ligera 🚶</option>
        <option value="1.55">Actividad moderada 🏃</option>
        <option value="1.725">Muy activo 🏋️</option>
    </select>

    <div class="botones">
        <button class="calcular" onclick="calcular()">Calcular 💖</button>
        <button class="limpiar" onclick="limpiar()">Limpiar 🧹</button>
    </div>

    <div id="resultado">

        <h2>🌈 Tu resultado</h2>

        <p>Estimación diaria:</p>

        <div id="calorias">0 kcal</div>

        <div class="barra">
            <div id="progreso"></div>
        </div>

        <p class="mensaje" id="mensaje"></p>

    </div>

    <p class="nota">
        ⚠️ Esta calculadora proporciona una estimación y no sustituye
        la orientación de un profesional de la salud.
    </p>

</div>

<script>

function calcular() {

    let edad = Number(document.getElementById("edad").value);
    let peso = Number(document.getElementById("peso").value);
    let altura = Number(document.getElementById("altura").value);
    let sexo = document.getElementById("sexo").value;
    let actividad = Number(document.getElementById("actividad").value);

    if (!edad || !peso || !altura || !sexo || !actividad) {
        alert("🌸 Completa todos los datos primero.");
        return;
    }

    let metabolismo;

    if (sexo === "mujer") {
        metabolismo = (10 * peso) + (6.25 * altura) - (5 * edad) - 161;
    } else {
        metabolismo = (10 * peso) + (6.25 * altura) - (5 * edad) + 5;
    }

    let calorias = Math.round(metabolismo * actividad);

    document.getElementById("resultado").style.display = "block";

    document.getElementById("calorias").innerText =
        calorias + " kcal";

    let porcentaje = Math.min((calorias / 3000) * 100, 100);

    document.getElementById("progreso").style.width =
        porcentaje + "%";

    document.getElementById("mensaje").innerText =
        "✨ Esta es una estimación de tus necesidades energéticas diarias.";
}

function limpiar() {

    document.getElementById("edad").value = "";
    document.getElementById("peso").value = "";
    document.getElementById("altura").value = "";
    document.getElementById("sexo").value = "";
    document.getElementById("actividad").value = "";

    document.getElementById("resultado").style.display = "none";
    document.getElementById("progreso").style.width = "0%";
}

</script>

</body>
</html>
